<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assam Rifles Public School Agartala | ARPS Tripura (CBSE)</title>
    <meta name="description" content="Assam Rifles Public School (ARPS), Agartala, Tripura - Affiliated to CBSE New Delhi. Official website with admissions, fees, notices, faculty and facilities." />
    <meta property="og:title" content="Assam Rifles Public School Agartala | ARPS Tripura" />
    <meta property="og:description" content="Assam Rifles Public School (ARPS), Agartala, Tripura - Affiliated to CBSE New Delhi. Official portal for admissions, notices, academics, and achievements." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/arps-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Quicksand:wght@500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #ffffff; text-align: center; padding: 24px;">
        <div style="width: 52px; height: 52px; border: 3.5px solid rgba(239, 90, 90, 0.2); border-top-color: #ef5a5a; border-radius: 50%; animation: arps-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #ffffff; font-family: 'Cinzel', serif, sans-serif; letter-spacing: 0.5px;">Assam Rifles Public School</h2>
        <p style="margin: 8px 0 0; font-size: 13px; color: #94a3b8;">Loading school portal...</p>
        <noscript>
          <p style="margin-top: 16px; color: #f87171; font-size: 14px;">JavaScript is required to display this school portal. Please enable JavaScript in your browser.</p>
        </noscript>
      </div>
      <style>
        @keyframes arps-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script>
      window.__arpsLoaded = false;
      window.__arpsLoadFallback = function() {
        if (window.__arpsLoaded) return;
        window.__arpsLoaded = true;
        if (!document.querySelector('link[href*="assets/index.css"]')) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/index.css';
          document.head.appendChild(link);
        }
        if (!document.querySelector('script[src*="assets/index.js"]')) {
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          document.body.appendChild(script);
        }
      };
      setTimeout(function() {
        if (!window.__arpsLoaded) {
          window.__arpsLoadFallback();
        }
      }, 1500);
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__arpsLoadFallback()"></script>
  </body>
</html>
